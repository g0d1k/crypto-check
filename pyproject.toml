[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-check"
dynamic = ["version"]
description = "A desktop crypto price checker: search any coin by name or ticker symbol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "g0d1k" }]
requires-python = ">=3.9"
dependencies = [
    "customtkinter>=5.2.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]
keywords = ["crypto", "cryptocurrency", "bitcoin", "price", "coingecko", "customtkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/g0d1k/crypto-check"
Issues = "https://github.com/g0d1k/crypto-check/issues"

# gui-scripts: on Windows this launches without a console window.
[project.gui-scripts]
crypto-check = "crypto_check.app:main"

[tool.setuptools.packages.find]
include = ["crypto_check*"]

[tool.setuptools.package-data]
crypto_check = ["assets/*"]

[tool.setuptools.dynamic]
version = { attr = "crypto_check.__version__" }
